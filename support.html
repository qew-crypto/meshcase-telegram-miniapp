<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поддержка — MeshCase</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="account.css"></head><body><header class="wrap"><a href="index.html">← Кейсы</a>　<b>MeshCase · поддержка</b>　<button id="accountBtn" class="btn btn-ghost">Войти</button></header><main class="wrap"><h1>Техническая поддержка</h1><p>Оставьте вопрос: ответ появится здесь. Выдача и платежи пока не подключены.</p><form id="supportForm"><label for="message">Сообщение</label><textarea id="message" minlength="5" maxlength="2000" required></textarea><button class="btn btn-primary">Отправить</button></form><p id="status" role="status"></p><h2>Мои обращения</h2><div id="tickets"></div></main><script src="account.js"></script><script>window.addEventListener('meshcase-auth-ready',()=>{let list=document.getElementById('tickets'),status=document.getElementById('status');const draw=()=>fetch('/api/tickets').then(r=>r.json()).then(j=>{list.replaceChildren();for(let t of j.tickets){let e=document.createElement('div');e.className='ticket';e.textContent='#'+t.id+' · '+new Date(t.created*1000).toLocaleString('ru-RU')+'\n'+t.body+'\nОтвет: '+(t.answer||'Ожидается');list.append(e)}});draw();document.getElementById('supportForm').onsubmit=async e=>{e.preventDefault();let body=document.getElementById('message').value;let r=await fetch('/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});let j=await r.json();status.textContent=j.error||'Сообщение отправлено';if(r.ok){e.target.reset();draw()}}});</script></body></html>
