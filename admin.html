<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ — MeshCase</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="account.css"></head><body><header class="wrap"><a href="index.html">← Кейсы</a>　<b>MeshCase · админ-панель</b>　<button id="accountBtn" class="btn btn-ghost">Войти</button></header><main class="wrap"><h1>Админ-панель</h1><p id="status" role="status"></p><h2>Аккаунты</h2><div id="users"></div><h2>Обращения ТП</h2><div id="tickets"></div></main><script src="account.js"></script><script>window.addEventListener('meshcase-auth-ready',()=>{let st=document.getElementById('status');if(window.meshcaseUser.role!=='admin'){st.textContent='Доступ запрещён';return}const draw=()=>fetch('/api/admin').then(async r=>{if(!r.ok)throw Error('Доступ запрещён');return r.json()}).then(j=>{const u=document.getElementById('users'),t=document.getElementById('tickets');u.replaceChildren();t.replaceChildren();for(let x of j.users){let el=document.createElement('div');el.className='ticket';el.textContent=x.nick+' · '+x.role;u.append(el)}for(let x of j.tickets){let el=document.createElement('div');el.className='ticket';let content=document.createElement('p');content.textContent='#'+x.id+' · '+x.nick+': '+x.body+'\nОтвет: '+(x.answer||'нет');el.append(content);let form=document.createElement('form');let area=document.createElement('textarea');area.required=true;area.maxLength=2000;area.value=x.answer;let b=document.createElement('button');b.className='btn btn-primary';b.textContent='Ответить';form.append(area,b);form.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:x.id,answer:area.value})});let j=await r.json();st.textContent=j.error||'Ответ сохранён';if(r.ok)draw()};el.append(form);t.append(el)}}).catch(e=>st.textContent=e.message);draw()});</script></body></html>
